{% include "header.html" %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="m-0">Search Results</h2>
                <a class="btn btn-outline-light btn-sm" href="{{ url_for('main_page') }}">Back to Search</a>
            </div>
            
            <div class="list-group">
                {% for song in list_of_songs %}
                <div class="list-group-item">
                    <img src="{{ song.img }}" class="song-img" alt="Cover">
                    <div class="song-info">
                        <div class="song-name">{{ song.name }}</div>
                        <div class="song-artists">
                            {% for artist in song.artists %}{{ artist }}{% if not loop.last %}, {% endif %}{% endfor %}
                        </div>
                    </div>
                    <div class="ms-auto">
                        <a class="btn btn-sm btn-primary px-4 py-2" href="{{ url_for('adding_to_list', song=song) }}">Add</a>
                    </div>
                </div>
                {% endfor %}
            </div>
            
            <div class="text-center mt-5">
                <a class="btn btn-outline-light" href="{{ url_for('main_page') }}">Back to Search</a>
            </div>
        </div>
    </div>
</div>

{% include "footer.html" %}
