<div class="container-fluid">
    <ul class="list-group list-group-flush">
        {% for song in list_of_songs %}
        <div class="row align-items-center g-3">
            <div class="col-3 col-sm-2">
                <img src="{{ song.img }}" class="img-fluid rounded" alt="Song Image">
            </div>

            <li class="list-group-item col-7 col-sm-6">
                {{ song.name }}
                {% for artist in song.artists %}
                    <span>{{ artist }}</span>
                {% endfor %}
            </li>

            <div class="col-2 col-sm-3 d-flex align-items-center">
                <a class="btn btn-primary w-100" href="{{ url_for('adding_to_list', song=song) }}">Add</a>
            </div>
        </div>
        {% endfor %}
    </ul>
</div>
